# bathRadio — Feather HUZZAH ESP8266
# Modes: радио | блютуз (status only in MVP)
# Flash: esphome run toilet-radio.yaml --device COM11

esphome:
  name: toilet-radio
  friendly_name: Туалетное радио
  comment: bathRadio MVP — mode status + web UI
  project:
    name: DimaSculp.bathRadio
    version: "0.1.0"

esp8266:
  board: huzzah
  restore_from_flash: true
  early_pin_init: false

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    ssid: "toilet-radio-fallback"
    password: "bathradio8266"

captive_portal:

web_server:
  port: 80
  version: 2
  local: true
  auth:
    username: !secret web_username
    password: !secret web_password
  css_include: www/radio.css
  js_include: www/radio.js
  sorting_groups:
    - id: speaker
      name: "Динамик / радио"
      sorting_weight: 10

# 0 = off, 1 = radio, 2 = bluetooth
globals:
  - id: current_mode
    type: int
    restore_value: yes
    initial_value: "0"

text_sensor:
  - platform: template
    name: "Текущий режим"
    id: mode_label
    icon: mdi:speaker
    update_interval: never
    entity_category: diagnostic
    web_server_sorting_group: speaker
    lambda: |-
      if (id(current_mode) == 1) return {"радио"};
      if (id(current_mode) == 2) return {"блютуз"};
      return {"выкл"};

switch:
  - platform: template
    name: "Туалетное радио"
    id: sw_radio
    icon: mdi:radio
    restore_mode: DISABLED
    web_server_sorting_group: speaker
    lambda: |-
      return id(current_mode) == 1;
    turn_on_action:
      - lambda: |-
          id(current_mode) = 1;
      - switch.template.publish:
          id: sw_radio
          state: ON
      - switch.template.publish:
          id: sw_bt
          state: OFF
      - text_sensor.template.publish:
          id: mode_label
          state: "радио"
    turn_off_action:
      - lambda: |-
          if (id(current_mode) == 1) {
            id(current_mode) = 0;
          }
      - switch.template.publish:
          id: sw_radio
          state: OFF
      - lambda: |-
          if (id(current_mode) == 2) {
            id(mode_label).publish_state("блютуз");
          } else {
            id(mode_label).publish_state("выкл");
          }

  - platform: template
    name: "Туалетное радио с блютузом"
    id: sw_bt
    icon: mdi:bluetooth
    restore_mode: DISABLED
    web_server_sorting_group: speaker
    lambda: |-
      return id(current_mode) == 2;
    turn_on_action:
      - lambda: |-
          id(current_mode) = 2;
      - switch.template.publish:
          id: sw_bt
          state: ON
      - switch.template.publish:
          id: sw_radio
          state: OFF
      - text_sensor.template.publish:
          id: mode_label
          state: "блютуз"
    turn_off_action:
      - lambda: |-
          if (id(current_mode) == 2) {
            id(current_mode) = 0;
          }
      - switch.template.publish:
          id: sw_bt
          state: OFF
      - lambda: |-
          if (id(current_mode) == 1) {
            id(mode_label).publish_state("радио");
          } else {
            id(mode_label).publish_state("выкл");
          }

binary_sensor:
  - platform: status
    name: "Связь"
    web_server_sorting_group: speaker

sensor:
  - platform: wifi_signal
    name: "Wi‑Fi сигнал"
    update_interval: 60s
    web_server_sorting_group: speaker

button:
  - platform: restart
    name: "Перезагрузка"
    entity_category: config
